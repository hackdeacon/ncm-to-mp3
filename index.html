<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="NCM to MP3 Converter - Local browser decryption, batch conversion, no file upload required">
    <title>NCM to MP3</title>
    <link rel="icon" type="image/svg+xml" href="netease.svg">
    <link rel="stylesheet" href="index.css">
    <script>
        (function() {
            var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script>
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        });
    </script>
</head>

<body>
    <div class="app">
    <main class="main">
        <div class="container">
            <!-- Hero Section -->
            <section class="hero">
                <div class="hero-header">
                    <img src="netease.svg" alt="Logo" class="hero-logo">
                    <h2 class="hero-title">NCM to MP3</h2>
                </div>
                <p class="hero-subtitle">Local Only · No Upload · Ultra Fast</p>
            </section>

            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="upload" multiple accept=".ncm" hidden>
                <div class="upload-content">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17,8 12,3 7,8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                    </div>
                    <p class="upload-text">Select</p>
                    <p class="upload-hint">.ncm files</p>
                    <span class="upload-badge">Educational Use Only</span>
                </div>
            </div>

            <!-- File List -->
            <div class="file-list-container" id="download-all-btn-container" style="visibility: hidden;">
                <ul class="file-list" id="res-tbody"></ul>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p><a href="https://github.com/hackdeacon/ncm-to-mp3" target="_blank" rel="noopener">GitHub</a> · <a href="https://x.com/hackdeacon" target="_blank" rel="noopener">hackdeacon</a></p>
    </footer>
</div>

<!-- Audio Preview Modal -->
<div id="audio-modal" class="audio-modal" onclick="closeAudioModal(event)">
    <div class="audio-modal-content" onclick="event.stopPropagation()">
        <button class="audio-modal-close" onclick="closeAudioModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <img src="netease.svg" alt="" class="audio-modal-icon">
        <div id="audio-title" class="audio-title"></div>
        <audio id="audio-player" controls></audio>
    </div>
</div>

<script src="./assets/jquery.js"></script>
<script src="./assets/metaflac.js"></script>
<script src="./assets/jsmediatags.min.js"></script>
<script src="./assets/decrypt.js"></script>
<script src="./assets/aes.js"></script>
<!-- <script src="./assets/zip.js"></script> -->
<script src="./assets/id3.js"></script>
<script src="./assets/script-v2.js"></script>
<script>
    function closeAudioModal(event) {
        if (!event || event.target === document.getElementById('audio-modal')) {
            var audioPlayer = document.getElementById('audio-player');
            audioPlayer.pause();
            audioPlayer.src = '';
            document.getElementById('audio-modal').style.display = 'none';
        }
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeAudioModal();
    });
    $(document).ready(function () {
        if (typeof checkBrowser === "function") {
            checkBrowser();
            document.getElementById('upload').addEventListener('change', handleFileSelect, false);
        }
        document.getElementById('uploadArea').addEventListener('click', function() {
            document.getElementById('upload').click();
        });
    });
</script>
</body>

</html>
